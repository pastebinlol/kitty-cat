[package]
name = "desktop-cat"
version = "0.3.1"
description = "A tiny desktop cat companion"
authors = ["you"]
edition = "2021"
[lib]
name = "desktop_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
